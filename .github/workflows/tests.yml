name: Testes do projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regras:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias dos testes de regras
        run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Verificar sintaxe
        run: python -m compileall -q app.py evaluate.py ocr_service.py src tools tests
      - name: Executar testes sem camera ou download de modelos
        run: python -m unittest discover -s tests -v
